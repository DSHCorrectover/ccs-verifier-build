name: Build Wheels

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-wheels:
    name: ${{ matrix.os }} py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Fetch proprietary source
        run: |
          git clone --depth 1 https://${{ secrets.CI_PAT }}@github.com/DSHCorrectover/ccs-verifier-prop.git /tmp/prop
          cp /tmp/prop/ccs_verifier/audit_cli.py ccs_verifier/
          cp /tmp/prop/ccs_verifier/builtin_rules.py ccs_verifier/
          echo "Proprietary source fetched."

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install Cython build wheel

      - name: Build wheel
        run: python -m build --wheel --outdir dist

      - name: Verify wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -c "import ccs_verifier; print(f'ccs-verifier imported OK from {ccs_verifier.__file__}')"
          python -c "from ccs_verifier import audit_cli; print('audit_cli module loaded OK')"
          python -c "from ccs_verifier import builtin_rules; print('builtin_rules module loaded OK')"
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python }}
          path: dist/*.whl
