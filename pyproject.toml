[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ccs-verifier"
version = "1.1.11"
description = "CCS Runtime Verifier — Out-of-process verification for AI agent commands"
readme = "README.md"
license = {text = "Proprietary Commercial License"}
requires-python = ">=3.10"
keywords = ["security", "ai", "agent", "mcp", "runtime-verification", "ccs"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "jcs>=0.2",
]

[project.optional-dependencies]
l1 = ["cryptography>=41.0"]
dev = [
    "cryptography>=41.0",
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
ccs-verifier = "ccs_verifier.__main__:main"

[tool.setuptools.packages.find]
include = ["ccs_verifier*"]
