[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ccs-verifier"
version = "1.1.15"
description = "CCS Runtime Verifier — IETF-aligned 7-dimension verification for AI agent delegation chains. Authority non-widening, cycle detection, signed provenance. Sub-50μs."
readme = "README.md"
homepage = "https://correctover.com"
documentation = "https://correctover.com/audit"
repository = "https://codeberg.org/correctover-labs/ccs-verifier"
license = {text = "Proprietary Commercial License"}
requires-python = ">=3.10"
keywords = ["security", "ai", "agent", "mcp", "runtime-verification", "ccs"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "jcs>=0.2",
]

[project.optional-dependencies]
l1 = ["cryptography>=41.0"]
dev = [
    "cryptography>=41.0",
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
ccs-verifier = "ccs_verifier.__main__:main"

[tool.setuptools.packages.find]
include = ["ccs_verifier*", "tests*"]

[tool.setuptools.package-data]
ccs_verifier = ["reference_issuer.json"]
tests = ["conformance-vectors/*.json"]
"tests.conformance-vectors" = ["*.json"]
