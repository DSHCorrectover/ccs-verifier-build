[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ccs-verifier"
version = "1.1.17"
description = "CCS Runtime Verifier — 7-dimension cryptographic verification for AI agent delegation chains. Authority non-widening, cycle detection, signed provenance. Sub-50us."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Elastic License 2.0"}
authors = [
    {name = "Correctover"},
]
keywords = ["security", "ai", "agent", "mcp", "runtime-verification", "ccs", "ed25519", "evidence-receipts", "jcs", "rfc8785"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "jcs>=0.2",
]

[project.optional-dependencies]
l1 = ["cryptography>=41.0"]
dev = [
    "cryptography>=41.0",
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.urls]
Homepage = "https://github.com/DSHCorrectover/ccs-verifier#readme"
Repository = "https://github.com/DSHCorrectover/ccs-verifier"
"Bug Tracker" = "https://github.com/DSHCorrectover/ccs-verifier/issues"
"Documentation" = "https://github.com/DSHCorrectover/ccs-verifier#specification--resources"
"npm Package" = "https://www.npmjs.com/package/ccs-mcp-server"
"Zenodo DOI" = "https://doi.org/10.5281/zenodo.22055351"

[project.scripts]
ccs-verifier = "ccs_verifier.__main__:main"

[tool.setuptools.packages.find]
include = ["ccs_verifier*", "tests*"]

[tool.setuptools.package-data]
ccs_verifier = ["reference_issuer.json"]
tests = ["conformance-vectors/*.json"]
"tests.conformance-vectors" = ["*.json"]
